# Shared with every vhost (this repo's or an app's own) via
# `include snippets/acme-challenge.conf;` in its port-80 server block.
# Backs `certbot certonly --webroot -w /var/www/certbot`, which only ever
# drops a challenge file here -- it never edits a vhost's nginx config, so
# there's nothing for this repo (or an app's own conf) to drift from.
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
