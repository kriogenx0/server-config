# Shared TLS settings, included by every vhost's 443 server block via
# `include snippets/ssl-params.conf;`. Cert paths stay per-vhost (they're
# domain-specific: /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem)
# so they're not part of this file -- each vhost sets those two lines
# itself, right next to this include.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
