# PHP app (PHP-FPM), content lives on the server in /var/www/flyer.ironyoung.com.
server {
    listen 80;
    listen [::]:80;
    server_name flyer.ironyoung.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flyer.ironyoung.com;

    ssl_certificate     /etc/letsencrypt/live/flyer.ironyoung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flyer.ironyoung.com/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/flyer.ironyoung.com;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
