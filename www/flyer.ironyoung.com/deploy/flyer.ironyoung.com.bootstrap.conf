# HTTP-only vhost installed first so certbot's http-01 challenge has
# somewhere to be served from; deploy.sh swaps it for flyer.ironyoung.com.conf
# once the cert exists.
server {
    listen 80;
    listen [::]:80;
    server_name flyer.ironyoung.com;

    include snippets/acme-challenge.conf;

    root /var/www/flyer.ironyoung.com;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
