# Static site, no container -- nginx serves index.html directly out of
# /var/www/thefword.site. Plain HTTP still needs to answer for renewals'
# http-01 challenge, so it stays around as a redirect rather than being
# dropped once HTTPS is up.
server {
    listen 80;
    listen [::]:80;
    server_name thefword.site www.thefword.site;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thefword.site www.thefword.site;

    ssl_certificate     /etc/letsencrypt/live/thefword.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thefword.site/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/thefword.site;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
