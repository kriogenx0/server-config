# HTTP-only vhost installed first so certbot's http-01 challenge has
# somewhere to be served from. deploy.sh swaps this for thefword.site.conf
# (the full HTTPS vhost) once the cert exists. See server-config's README,
# "Bringing up a brand-new site with its own CI-driven deploy".
server {
    listen 80;
    listen [::]:80;
    server_name thefword.site www.thefword.site;

    include snippets/acme-challenge.conf;

    root /var/www/thefword.site;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
